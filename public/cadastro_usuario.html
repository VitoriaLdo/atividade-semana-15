<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — VLY Livros</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
<header>
  <div class="container cabecalho">
    <a href="index.html" class="logo">🦉 VLY Livros</a>
    <a href="login.html" class="nav-link">← Voltar ao login</a>
  </div>
</header>

<main>
  <div class="auth-box">
    <div class="auth-icon">📝</div>
    <h1 class="auth-title">Criar Conta</h1>
    <p class="auth-subtitle">Crie sua conta para acessar todos os recursos</p>

    <div id="msg-erro" class="msg-erro"></div>
    <div id="msg-sucesso" class="msg-sucesso"></div>

    <form id="form-cadastro">
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label for="login">Login</label>
        <input type="text" id="login" placeholder="Escolha um login" required minlength="3">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Crie uma senha" required minlength="3">
      </div>
      <div class="form-group">
        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" placeholder="Repita a senha" required>
      </div>
      <button type="submit" class="btn-primary-auth">Criar Conta</button>
    </form>

    <div class="auth-link">
      Já tem conta? <a href="login.html">Entrar</a>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 - Vitória Letícia de Oliveira</p>
</footer>

<script src="assets/js/login.js"></script>
</body>
</html>
